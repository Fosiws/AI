<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平行四边形的认识</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            color: white;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .buttons {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .task-btn {
            padding: 20px 40px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            min-width: 180px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .task-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.3);
        }

        .task-btn:active {
            transform: translateY(-2px);
        }

        .btn1 {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
        }

        .btn2 {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
        }

        .btn3 {
            background: linear-gradient(45deg, #45b7d1, #96c93d);
        }

        .task-btn:hover.btn1 {
            background: linear-gradient(45deg, #ff5252, #ff6347);
        }

        .task-btn:hover.btn2 {
            background: linear-gradient(45deg, #26d0ce, #3a7bd5);
        }

        .task-btn:hover.btn3 {
            background: linear-gradient(45deg, #3498db, #2ecc71);
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 20px;
            }

            h1 {
                font-size: 2em;
                margin-bottom: 30px;
            }

            .buttons {
                flex-direction: column;
                gap: 20px;
            }

            .task-btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>平行四边形的认识</h1>
        <div class="buttons">
            <button class="task-btn btn1" onclick="window.open('https://fosiws.github.io/AI/1')">
                任务一<br>
                平行四边形的边角剪切
            </button>
            <button class="task-btn btn2" onclick="window.open('https://fosiws.github.io/AI/2')">
                任务二<br>
                平行四边形交叠任务
            </button>
            <button class="task-btn btn3" onclick="window.open('https://fosiws.github.io/AI/3')">
                任务三<br>
                特征复习
            </button>
        </div>
    </div>



    <script>
        // 添加点击动画效果
        document.querySelectorAll('.task-btn').forEach(button => {
            button.addEventListener('click', function () {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);
            });
        });
    </script>
</body>


</html>
